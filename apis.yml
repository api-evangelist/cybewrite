name: Cyberwrite
description: >-
  Cyberwrite is an AI-powered cyber insurance intelligence platform, founded in
  2017, that turns raw data into explainable, defensible financial decisions for
  the cyber insurance market. Its proprietary 4SEEN AI engine assesses cyber
  risk, forecasts breaches, simulates financial impact, and recommends
  mitigation, giving brokers, carriers, reinsurers, MGAs, ILS investors, and
  corporates access to cyber risk analytics, catastrophe modeling, and risk
  quantification on more than 100 million companies worldwide in seconds and in
  eight languages. Cyberwrite delivers its scoring and analytics through an
  enterprise API for real-time aggregated risk management; the platform is a
  Gartner Cool Vendor and DIA Top 100 InsurTech, and was surfaced to the API
  Evangelist network as a 500 Global portfolio company.
